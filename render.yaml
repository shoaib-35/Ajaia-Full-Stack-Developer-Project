services:
  - type: web
    name: ajaia-docs
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ajaia-docs.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ajaia-docs.onrender.com

databases:
  - name: ajaia-docs-db
    databaseName: ajaia_docs
    user: ajaia_docs
